<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker Gus</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#0f172a">
</head>

<body>

    <header>
        <h1>🏋️ Gym Tracker Gus</h1>
        <p>Tu progreso, siempre contigo</p>
    </header>

    <main>

        <div class="menu">

    <button class="card" onclick="mostrarPantalla('rutina')">
        💪<br>
        Entrenar
    </button>

    <button class="card" onclick="mostrarPantalla('historial')">
        📅<br>
        Historial
    </button>

    <button class="card" onclick="mostrarPantalla('estadisticas')">
        📈<br>
        Estadísticas
    </button>

    <button class="card" onclick="mostrarPantalla('peso')">
        ⚖️<br>
        Peso corporal
    </button>

    <button class="card" onclick="mostrarPantalla('prs')">
        🏆<br>
        PRs
    </button>

    <button class="card" onclick="mostrarPantalla('backup')">
        💾<br>
        Backup
    </button>

    <button class="card" onclick="mostrarPantalla('rutinas')">
        📋<br>
        Rutinas
    </button>

    <button class="card" onclick="mostrarPantalla('progreso')">
        📊<br>
        Progreso
    </button>

</div>
        <section id="contenido">

            <h2>🏋️ Resumen</h2>

            <div class="stat-card">
                <p>Total series registradas</p>
                <div class="stat-number" id="totalSeries">0</div>
            </div>

            <div class="stat-card">
                <p>Ejercicios diferentes</p>
                <div class="stat-number" id="totalEjercicios">0</div>
            </div>

            <div class="stat-card">
                <p>Peso corporal actual</p>
                <div class="stat-number" id="pesoActual">--</div>
            </div>

            <div class="stat-card">
                <p>Último entrenamiento</p>
                <div id="ultimoEntreno">Sin registros</div>
            </div>

        </section>

    </main>

<script src="ejercicios.js"></script>
<script src="ipt>
<script src="app.js"></script>

</body>

</html>
